name: CI-test

env:
  GITHUB_ACTIONS: true

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"

  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  CI:
    strategy:
      matrix:
        os-version: ["windows-latest", "ubuntu-latest", "macos-14"]
        python-version: ["3.9"]
        pytorch-version: ["2.7.1", "2.1.2", "2.0.0"]

    runs-on: ${{ matrix.os-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv sync

      - name: Install PyTorch 2.7.1
        if: matrix.pytorch-version == '2.7.1'
        run: |
          uv pip install torch==2.7.1 torchvision==0.22.1 torchaudio==2.7.1

      - name: Install PyTorch 2.1.2
        if: matrix.pytorch-version == '2.1.2'
        run: |
          uv pip install torch==2.1.2 torchvision==0.16.2 torchaudio==2.1.2

      - name: Install PyTorch 2.0.0
        if: matrix.pytorch-version == '2.0.0'
        run: |
          uv pip install torch==2.0.0 torchvision==0.15.1 torchaudio==2.0.1

      - name: Show environment
        run: |
          uv pip list

      - name: Test
        run: |
          make lint
          make test

      - name: Save coverage report
        if: matrix.os-version == 'ubuntu-latest' && matrix.python-version == '3.9' && matrix.pytorch-version == '2.7.1'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  coverage:
    needs: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage.xml
